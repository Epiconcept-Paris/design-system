[production]


voozanoo.protocole = http
voozanoo.host = localhost
voozanoo.baseurl = /designsystem/




;;;;;;;;;;;;;
; Related to the container's environment (file system path, etc...)
;;;;;;;;;;;;;
lib.yui.path                            = CHEMIN_EXTLIB "/yui"
voozanoo.executable.mysql               = "/usr/bin/"


includePaths.library                    = APPLICATION_PATH "/library"


voozanoo.resources.path                 = APPLICATION_PATH "/resources"


dir.temp                                = "/var/www/tmp/"
voozanoo.upload.chunk.directory         = "/var/www/tmp/"
voozanoo.upload.directory               = "/var/www/storage/"


voozanoo.log.enable                     = TRUE
voozanoo.log.conf.timestampFormat       = 'Y-m-d H:i:s'
voozanoo.log.conf.stream.writerName     = "Stream"
voozanoo.log.conf.stream.writerParams.stream = "/var/www/html/error.log"
voozanoo.log.conf.stream.writerParams.mode = "a"


;;;;;;;;;;;;;
; Database
;;;;;;;;;;;;;
resources.db.params.host = "designsystem-mariadb"
resources.db.params.dbname = "designsystem"
resources.db.params.username = "root"
resources.db.params.password = "root"
resources.db.params.driver_options.1002 = "SET sql_mode='';"






;paramétrage pour que l'export asynchrone
voozanoo.export_async.activate = true
voozanoo.export_async.directory = "/var/www/tmp/"
voozanoo.export_async.max_per_user = 2
voozanoo.export_async.max_per_project = 3
voozanoo.notification.system = "notiflix"


;;;;;;;;;;;;;
; Public route for static JS libs
;;;;;;;;;;;;;
lib.voozanoo.javascript.url             = "/designsystem/libs/VooLibJs"
lib.voozanoo.assets.url                 = "/designsystem/libs/VooLibAssets"
lib.yui.url                             = "/designsystem/libs/yui"
lib.yui2.url                            = "/designsystem/libs/yui2"
lib.codemirror.url                      = "/designsystem/libs/codemirror/5.45"
lib.ckeditor.url                        = "/designsystem/libs/ckeditor"
lib.leaflet.url                         = "/designsystem/libs/leaflet"
lib.leafletchoropleth.url               = "/designsystem/libs/leafletchoropleth"
lib.bootstrap.url                       = "/designsystem/libs/bootstrap"
lib.datepicker.url                      = "/designsystem/libs/datepicker"
lib.jquery.url                          = "/designsystem/libs/jquery"
lib.fontawesome.url                     = "/designsystem/libs/fontawesome"
lib.bootstrap-treeview.url              = "/designsystem/libs/bootstrap-treeview"
lib.datetimepicker.url                  = "/designsystem/libs/datetimepicker"
lib.momentjs.url                        = "/designsystem/libs/momentjs"
lib.epilogo.url                         = "/designsystem/libs/epilogo"
lib.visualCaptcha.url                   = "/designsystem/libs/visualCaptcha-frontend"
lib.notiflix.url                        = "/designsystem/libs/popups/notiflix"
lib.jquery-multiselect.url              = "/designsystem/libs/jquery-multiselect"


;;;;;;;;;;;;;
; Mail
;;;;;;;;;;;;;
resources.mail.transport.host = "fakemail"
resources.mail.transport.port = "1025"


;;;;;;;;;
; Session
;;;;;;;;;
resources.session.name = "PHPSESSID_myproject"


;;;;;;;;;;;;;
; Divers
;;;;;;;;;;;;;
apply_css_on_connection_pages = TRUE


voozanoo.use_date_advanced            = TRUE


epicraft.pull.allowed_url[]  = "https://epicraft.preprod.voozanoo.net/epicraft"


[development : production]
[alpha: development ]