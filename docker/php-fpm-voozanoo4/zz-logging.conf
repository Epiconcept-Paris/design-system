; Force des paramètres d'erreurs au niveau PHP-FPM pool (non surchargeable par ini_set)
;
; Objectif:
; - Ne jamais injecter warnings/deprecated dans la réponse HTTP (display_errors=off)
; - Conserver les erreurs dans les logs du container (stderr)
;
; Référence: php_admin_* s'applique au niveau pool et ne peut pas être modifié par l'application.

[www]
; Capture stdout/stderr des workers dans le log FPM (utile si du code écrit sur stderr)
catch_workers_output = yes
; Évite un préfixage verbeux dans certains cas
;decorate_workers_output = no

php_admin_flag[display_errors] = off
php_admin_flag[display_startup_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_reporting] = E_ALL

; Envoyer les logs PHP sur stderr du process (capturé par Docker)
php_admin_value[error_log] = /proc/self/fd/2
