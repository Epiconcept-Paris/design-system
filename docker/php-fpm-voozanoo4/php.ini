; ============================================================================
; PHP Configuration - MailMerge Local Development
; ============================================================================

; ============================================================================
; ERROR REPORTING & LOGGING
; ============================================================================
; Reporter TOUTES les erreurs en interne pour les logs
error_reporting = E_ALL

; Désactiver l'affichage des erreurs dans le navigateur
display_errors = Off
display_startup_errors = Off

; Logger les erreurs (warnings/deprecated inclus) dans les logs du container
log_errors = On
; Envoyer le log d'erreurs PHP sur stderr (capturé par Docker)
; (si vous préférez stdout: /proc/self/fd/1)
error_log = /proc/self/fd/2

; Réduire le risque d'injection HTML dans les sorties d'erreur (même si display_errors=Off)
html_errors = Off

; Ne pas ignorer les arguments dans les exceptions (utile pour le débogage)
zend.exception_ignore_args = Off

; ============================================================================
; SÉCURITÉ
; ============================================================================
; Ne pas exposer la version PHP pour la sécurité
expose_php = Off

; ============================================================================
; CHEMINS & INCLUDES
; ============================================================================
; Ajouter les chemins des frameworks et bibliothèques
include_path = .:/var/www/libs/ZendFramework/latest/

; Charger automatiquement le fichier de configuration avant chaque script
auto_prepend_file = /usr/local/etc/php/prepend.php

; ============================================================================
; PERFORMANCE & LIMITES
; ============================================================================
; Limites pour les uploads et les exécutions
max_upload_filesize = 100M
post_max_size = 100M
max_execution_time = 300
memory_limit = 256M

; ============================================================================
; SESSION
; ============================================================================
; Configuration de session pour le développement
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax