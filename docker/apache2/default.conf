ServerName localhost
ServerAdmin framework@epiconcept.fr

LoadModule deflate_module /usr/local/apache2/modules/mod_deflate.so
LoadModule proxy_module /usr/local/apache2/modules/mod_proxy.so
LoadModule proxy_fcgi_module /usr/local/apache2/modules/mod_proxy_fcgi.so
LoadModule rewrite_module /usr/local/apache2/modules/mod_rewrite.so

<VirtualHost *:80>
    DocumentRoot /var/www/app/public

    Alias /libs /var/www/libs/voozanoo4/2.26/libs
    Alias /vendor /var/www/libs/voozanoo4/2.26/vendor

    SetEnv VOO4_APPBOOTSTRAPPER "/var/www/libs/voozanoo4/2.26/src/tools/Voo4_AppBootstrapper.php"
    SetEnv PATH_VOO4_CORE "/var/www/libs/voozanoo4/2.26/src"
    SetEnv PATH_VOO4_EXTLIB "/var/www/libs/voozanoo4/2.26/libs"
    SetEnv PATH_FARM "/var/www/workdata"
    SetEnv PATH_ZF "/var/www/libs/ZendFramework"

    <Directory /var/www/app/public>
        AllowOverride None NonFatal=Override
        # On autorise seulement les directives nécessaires en .htaccess
        AllowOverrideList RewriteEngine RewriteBase RewriteCond RewriteRule
        Require all granted
        CGIPassAuth On

        <FilesMatch \.php$>
            SetHandler "proxy:fcgi://${FPM_CONTAINER_NAME}:9000"
        </FilesMatch>
    </Directory>

    <Directory /var/www/libs>
        AllowOverride all
        Require all granted
    </Directory>
</VirtualHost>

